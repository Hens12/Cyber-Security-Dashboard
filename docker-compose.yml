version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel_x_db
    restart: always
    environment:
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: sentinel_secure_pass_2026
      POSTGRES_DB: sentinel_x
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinel_x_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_x_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://sentinel_admin:sentinel_secure_pass_2026@postgres:5432/sentinel_x
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
      - SECRET_KEY=sentinel-x-production-secret-key-change-me
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_x_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
